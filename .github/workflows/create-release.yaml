name: Auto Release

on:
  push:
    tags:
      - 'v*' # Triggers only when a tag starting with 'v' (e.g., v1.1.0) is pushed

# Required permission to create a release in the repository
permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          # GITHUB_TOKEN is automatically provided by Actions
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
        # github.ref_name contains the tag name (e.g., v1.1.0)
        run: |
          gh release create ${{ github.ref_name }} \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes