name: Deploy Bot Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  REGION: 'us-west1'
  WORKLOAD_IDENTITY_PROVIDER: 'projects/515460920183/locations/global/workloadIdentityPools/my-pool/providers/my-provider'
  SERVICE_ACCOUNT: 'github-publisher@ef2-discord-bot.iam.gserviceaccount.com'
  ZONE: 'us-west1-b'
  INSTANCE_NAME: 'ef2-discord-bot-2'

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Required to compile linux/arm64 on standard GitHub runners
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Required to use the 'docker buildx' command
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v3'
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Login to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: 'oauth2accesstoken'
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and Push Docker Image
        # Tags the image with BOTH the specific release tag (e.g., v1.1.0) and 'latest'
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t us-west1-docker.pkg.dev/ef2-discord-bot/ef2-discord-bot/ef2-discord-bot:${{ github.ref_name }} \
            -t us-west1-docker.pkg.dev/ef2-discord-bot/ef2-discord-bot/ef2-discord-bot:latest \
            --push .

      - id: 'compute-ssh'
        uses: 'google-github-actions/ssh-compute@v2'
        with:
          instance_name: ${{ env.INSTANCE_NAME }}
          zone: ${{ env.ZONE }}
          ssh_private_key: '${{ secrets.GCP_SSH_PRIVATE_KEY }}'
          command: 'docker-credential-gcr configure-docker --registries us-west1-docker.pkg.dev && docker pull us-west1-docker.pkg.dev/ef2-discord-bot/ef2-discord-bot/ef2-discord-bot:latest && sudo systemctl restart ef2-discord-bot'
