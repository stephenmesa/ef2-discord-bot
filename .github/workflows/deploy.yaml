name: Deploy Bot Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  DOCKER_REGISTRY: 'us-west1-docker.pkg.dev'
  WORKLOAD_IDENTITY_PROVIDER: 'projects/515460920183/locations/global/workloadIdentityPools/my-pool/providers/my-provider'
  SERVICE_ACCOUNT: 'github-publisher@ef2-discord-bot.iam.gserviceaccount.com'
  IMAGE_NAME: 'us-west1-docker.pkg.dev/ef2-discord-bot/ef2-discord-bot/ef2-discord-bot'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Required to compile linux/arm64 on standard GitHub runners
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Required to use the 'docker buildx' command
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v3'
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Login to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: 'oauth2accesstoken'
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v3'
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - id: 'compute-ssh'
        uses: 'google-github-actions/ssh-compute@v2'
        with:
          instance_name: 'ef2-discord-bot-2'
          zone: 'us-west1-b'
          ssh_private_key: '${{ secrets.GCP_SSH_PRIVATE_KEY }}'
          command: 'docker-credential-gcr configure-docker --registries ${{ env.DOCKER_REGISTRY }} && docker pull ${{ env.IMAGE_NAME }}:latest && sudo systemctl restart ef2-discord-bot'
